[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
driver.path = "crates/driver"
err.path = "crates/err"
lex.path = "crates/lex"
parser.path = "crates/parser"
sess.path = "crates/sess"
span.path = "crates/span"
symbol.path = "crates/symbol"
ast.path = "crates/ast"
logos = "^0.16"
clap = { version = "^4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
